[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "open-alpha-lab"
version = "0.1.0"
description = "Open-Alpha-Lab: an open quant research desk. A reusable engine (quantlab) plus rigorous, reproducible audits of trading ideas — edge or mirage."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Guillain d'Erceville", email = "167749917+Guillain-RDCDE@users.noreply.github.com" }]
keywords = [
  "quantitative-finance",
  "market-microstructure",
  "overnight-returns",
  "backtesting",
  "reproducible-research",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "yfinance>=0.2.40",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "nbformat", "nbconvert", "ipykernel", "jupyter"]

[project.urls]
Repository = "https://github.com/Guillain-RDCDE/Open-Alpha-Lab"

[tool.setuptools]
packages = ["quantlab", "quantlab.brokers"]

[tool.pytest.ini_options]
# Make the repo root importable so `import quantlab` works whether tests are
# run via `pytest` (console script) or `python -m pytest`.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test needs live network + optional deps (duckdb); skips when absent.",
]
