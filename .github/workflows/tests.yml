name: tests

# Discovery replaces wiring: `pytest` collects the engine suite (tests/) and every study
# suite under studies/ from pyproject.toml's testpaths, so a new study needs no line here.
# A push that only touches studies/<id>/ dirs tests just those studies; anything else
# (engine, tools, this file, pyproject, docs...) and the nightly run test everything.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * *"   # nightly full run
  workflow_dispatch:       # always a full run

permissions:
  contents: read

concurrency:
  # The nightly full run has its own lane: a push must not cancel it.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash  # explicit shell = -eo pipefail

env:
  MPLBACKEND: Agg
  PYTHONUTF8: "1"

jobs:
  plan:
    name: plan (full or changed studies)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      targets: ${{ steps.plan.outputs.targets }}
      studies: ${{ steps.plan.outputs.studies }}
      demos: ${{ steps.plan.outputs.demos }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide what this run tests
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: python3 tools/ci_plan.py --event "$EVENT" --base "$BASE" --head "$HEAD"

  lint:
    name: lint (ruff syntax gate, studies index drift)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ruff (pinned; py310 syntax, undefined names -- config in pyproject.toml)
        run: |
          python -m pip install ruff==0.17.0
          ruff check --output-format=github .
      - name: studies/README.md matches the generator
        run: python tools/make_studies_index.py --check

  test:
    name: test (${{ matrix.python-version }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      TARGETS: ${{ needs.plan.outputs.targets }}
      STUDIES: ${{ needs.plan.outputs.studies }}
      DEMOS: ${{ needs.plan.outputs.demos }}
      JUNIT: junit-${{ matrix.python-version }}.xml
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        # Single source of truth: pyproject.toml, through the requirements.txt alias
        # (-e .[studies,dev]): engine, the studies' econometrics/ML stack, pytest and
        # pytest-xdist. The suite stays offline: real-data tests skip without their cache.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore the frozen skfolio tapes
        # Studies 1013-1027 read real tapes shipped inside packages (quantlab/bundled.py).
        # skfolio's three come from one pinned wheel, SHA-256 verified on every load; the
        # key follows the pins, so changing a pin refetches.
        id: tapes
        uses: actions/cache@v6
        with:
          path: studies/_cache/bundled
          key: skfolio-tapes-1.8.1-${{ hashFiles('quantlab/bundled.py') }}

      - name: Fetch the frozen skfolio tapes (cache miss only; best effort)
        if: steps.tapes.outputs.cache-hit != 'true'
        run: python -c "from quantlab import bundled; bundled.fetch_skfolio()" || echo "skfolio tapes not cached; gated tests will skip"

      - name: Study-construction gate (every published study, same construction)
        run: python tools/check_study_completeness.py

      - name: Ledger gate (docs/REFERENCE.md agrees with the studies)
        run: python tools/check_reference_table.py

      - name: Tests (${{ env.MODE }})
        id: pytest
        if: env.MODE == 'full' || env.TARGETS != ''
        run: |
          set -f  # node ids carry [brackets]; never glob them
          if [ "$MODE" = full ]; then targets="tests studies"; else targets="$TARGETS"; fi
          pytest -n auto --dist loadfile -p no:cacheprovider -rfE --junitxml="$JUNIT" $targets

      - name: Every study suite had tests collected
        if: always() && steps.pytest.outcome != 'skipped' && hashFiles(env.JUNIT) != ''
        run: |
          if [ "$MODE" = full ]; then
            python tools/check_study_completeness.py --collected "$JUNIT"
          else
            python tools/check_study_completeness.py --collected "$JUNIT" --only $STUDIES
          fi

      - name: Smoke-run the offline demos
        if: env.MODE == 'full' || env.DEMOS != ''
        run: |
          if [ "$MODE" = full ]; then python tools/run_smoke_demos.py; else python tools/run_smoke_demos.py $DEMOS; fi

      - name: Keep the test report
        if: always() && hashFiles(env.JUNIT) != ''
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.python-version }}
          path: ${{ env.JUNIT }}
          retention-days: 14
