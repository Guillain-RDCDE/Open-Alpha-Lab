name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Core only — no network/yfinance needed for the test-suite.
          pip install numpy pandas matplotlib pyarrow pytest

      - name: Run test-suite (offline, deterministic)
        run: pytest -q

      - name: Smoke-run the offline demo
        run: python studies/01-overnight-anomaly/examples/run_synthetic_demo.py
