name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Single dependency source of truth: pyproject.toml, installed through the
          # requirements.txt alias (-e .[studies,dev]). That covers the engine, the
          # econometrics/ML stack behind the studies (scipy/statsmodels/arch/scikit-learn)
          # and pytest. The test-suite itself stays offline: network/real-data tests are
          # cache-gated and skip when the cache is absent.
          pip install -r requirements.txt

      - name: Study-construction gate (every published study, same construction)
        run: python tools/check_study_completeness.py

      - name: Core engine test-suite (quantlab, offline, deterministic)
        run: pytest -q

      - name: Study 02 — Falling-Knife test-suite
        run: pytest -q studies/02-falling-knife/tests

      - name: Study 03 — Fear-Gauge test-suite
        run: pytest -q studies/03-fear-gauge/tests

      - name: Study 04 — Social-Oracle test-suite
